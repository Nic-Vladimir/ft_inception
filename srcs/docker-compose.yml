services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx:1.0
    ports:
      - "443:443"
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception_network

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress:1.0
    restart: always
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
    depends_on:
      - mariadb
    networks:
      - inception_network

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb:1.0
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception_network

# Passwords are never stored in .env nor in the Dockerfiles: they are mounted
# read-only inside the containers as /run/secrets/<name>.
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/vladimir/data/wp_data
      o: bind

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/vladimir/data/mariadb_data
      o: bind

networks:
  inception_network:
    driver: bridge
